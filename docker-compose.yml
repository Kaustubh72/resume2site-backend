services:
  db:
    image: postgres:16-alpine
    container_name: resume2site-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: resume2site
      POSTGRES_USER: resume2site
      POSTGRES_PASSWORD: resume2site
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume2site -d resume2site"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume2site-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/resume2site?currentSchema=resume2siteschema
      DB_USERNAME: resume2site
      DB_PASSWORD: resume2site
      APP_JWT_SECRET: change-me-change-me-change-me-change-me-please
      APP_JWT_ISSUER: resume2site
      APP_JWT_ACCESS_TTL_MINUTES: 60
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:4200
    restart: unless-stopped

volumes:
  postgres_data:
