spring:
  application:
    name: resume2site-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume2site}
    username: ${DB_USERNAME:resume2site}
    password: ${DB_PASSWORD:resume2site}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:10MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:10MB}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: '*'
    exposed-headers: Location
    allow-credentials: true
    max-age-seconds: 3600
  security:
    jwt:
      issuer: ${APP_JWT_ISSUER:resume2site}
      secret: ${APP_JWT_SECRET:change-me-change-me-change-me-change-me-please}
      access-token-ttl-minutes: ${APP_JWT_ACCESS_TTL_MINUTES:60}
  upload:
    max-file-size-bytes: ${APP_UPLOAD_MAX_FILE_SIZE_BYTES:10485760}
    allowed-content-types:
      - application/pdf
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    allowed-extensions:
      - pdf
      - docx
